<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIPS Reference - Treasury Investors Portal</title>
<link rel="stylesheet" href="../shared/src/portal-theme.css">
<link rel="stylesheet" href="../shared/src/tips-reference-table.css">
<style>
  body { font-size: 13px; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  header { padding: 9px 14px; background: var(--portal-card-bg); color: var(--portal-card-text); border-bottom: 1px solid var(--portal-header-bg); display: flex; align-items: center; gap: 12px; flex-shrink: 0; --trt-meta-color: var(--portal-card-text); --trt-label-color: var(--tab-inactive-text); }
  header h1 { font-size: 17px; margin: 0; color: var(--portal-card-text); }
  /* Look comes from shared .date-picker.flush (portal-theme.css); only width is app-specific. */
  #status { font-size: 11px; color: var(--tab-inactive-text); font-style: italic; margin-left: auto; }
  #status.error { color: #f87171; font-style: normal; font-weight: 600; }
  .btn { padding: 4px 10px; font-size: 11px; }
  .btn:hover:not(:disabled) { transform: none; box-shadow: none; }
  #table-host { flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head>
<body>

<header>
  <a href="../" class="portal-link">&#8592; Portal</a>
  <h1>TIPS Reference</h1>
  <div id="header-meta"></div>
  <span id="status" style="margin-left:auto;">Loading…</span>
  <button id="export-btn" class="btn" disabled>Export CSV</button>
</header>

<div id="table-host"></div>

<script type="module">
// The table, its header figures and its calculation are the shared modules tips-reference-table.js and
// tips-reference-rows.js (SharedModules.md M24, M25), which the TIPS Reference popup of TipsLadderManager also uses.
import { createTipsReferenceTable } from '../shared/src/tips-reference-table.js';
// Single entry point for market data (source decision, fetch, parse) — shared with
// TipsLadderManager so a YIELD_SOURCE flip applies to every consumer at once
// (TipsLadderManager/knowledge/4.1_Load_Market_Data.md §Source selection).
import { loadMarketData } from '../shared/src/market-data.js';

async function loadData() {
  const statusEl = document.getElementById('status');
  try {
    const d = await loadMarketData();
    createTipsReferenceTable({
      host: document.getElementById('table-host'),
      metaHost: document.getElementById('header-meta'),
      exportButton: document.getElementById('export-btn'),
      flushPicker: true,
      tipsRefRows: d.tipsRefRows,
      quotes: d.yieldsRows.map(r => ({ ...r, saYield: d.saYieldByCusip.get(r.cusip) ?? null })),
      refCpiRows: d.refCpiRows,
      bondHolidays: d.bondHolidays,
      // Trade = the data's as-of/"today" date (the Download Date; for the dormant
      // FedInvest cross-check path, settleDateStr doubles as this — see loadMarketData()).
      // Settlement = T+1, source-dependent (4.1_Load_Market_Data.md §Source selection).
      tradeDateStr: d.tradeDateStr,
      settlementDateStr: d.settleDateStr,
      showSaYield: true,
    });
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.classList.add('error');
  }
}

loadData();
</script>
</body>
</html>
